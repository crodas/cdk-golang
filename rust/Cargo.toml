[package]
name = "cdk-ffi-go"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.17.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]
name = "cdk_ffi_go"

[dependencies]
cdk-ffi = { git = "https://github.com/crodas/cdk", rev = "d71461c94416ce5b47e6110daf5a4ec32a41e1d6", features = ["npubcash", "nwc", "bip353"] }
uniffi = { version = "0.30", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.30", features = ["build"] }

[lints]


[profile.release]
lto = true
strip = true
codegen-units = 1
